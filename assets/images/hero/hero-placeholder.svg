  <rect width="900" height="600" fill="#EEDDCF"/>
  <circle cx="450" cy="300" r="210" fill="#FFF9F3" stroke="#D9B26F" stroke-width="3"/>
  <circle cx="450" cy="300" r="142" fill="#F3E7D9" stroke="#C87E8A" stroke-width="2"/>
  <path d="M362 350c20-108 46-154 88-154s68 46 88 154z" fill="#C87E8A" opacity=".72"/>
